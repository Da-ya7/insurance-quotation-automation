
<div class="app-layout">

  <!-- LEFT SIDEBAR -->
  <aside
    class="sidebar"
    [class.sidebar-closed]="!sidebarOpen">

    <!-- LOGO AND THREE-DASH BUTTON -->
    <div class="logo">

      <div class="logo-icon">IQ</div>

      <div class="logo-text">
        <h2>Insurance</h2>
        <p>Quotation</p>
      </div>

      <button
        class="menu-toggle"
        type="button"
        (click)="toggleSidebar()"
        [attr.aria-expanded]="sidebarOpen"
        aria-label="Toggle sidebar"
        title="Toggle sidebar">

        <span></span>
        <span></span>
        <span></span>

      </button>

    </div>

    <!-- SIDEBAR NAVIGATION -->
    <nav class="sidebar-nav">

      <a
        routerLink="/dashboard"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">Dashboard</span>
      </a>

      <a
        routerLink="/incoming-emails"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">📧</span>
        <span class="nav-label">Incoming Emails</span>
      </a>

      <a
        routerLink="/quotation-requests"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">📋</span>
        <span class="nav-label">Quotation Requests</span>
      </a>

      <a
        routerLink="/clients"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">👥</span>
        <span class="nav-label">Clients</span>
      </a>

      <a
        routerLink="/quotations"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">📄</span>
        <span class="nav-label">Quotations</span>
      </a>

      <a
        routerLink="/missing-information"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">⚠️</span>
        <span class="nav-label">Missing Information</span>
      </a>

      <a
        routerLink="/reports"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">📈</span>
        <span class="nav-label">Reports</span>
      </a>

      <a
        routerLink="/settings"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }">
        <span class="nav-icon">⚙️</span>
        <span class="nav-label">Settings</span>
      </a>

    </nav>

    <!-- SIDEBAR FOOTER -->
    <div class="sidebar-footer">
      <span class="status-dot"></span>
      <span class="footer-label">System Active</span>
    </div>

  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <!-- LOGOUT OVERLAY -->
    <div class="layout-header">

      <button
        type="button"
        class="logout-button"
        (click)="logout()"
        aria-label="Logout">

        <span class="logout-icon">🚪</span>
        <span>Logout</span>

      </button>

    </div>

    <!-- PAGE CONTENT -->
    <section class="page-content">

      <!-- CURRENT ROUTED PAGE -->
      <router-outlet></router-outlet>

    </section>

  </main>

</div>
