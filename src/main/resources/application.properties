spring.application.name=insurance-quotation-backend
server.port=8080

# ---------- Database (override with env vars) ----------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:iqas}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# ---------- JPA: Flyway owns schema, Hibernate only validates ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ---------- JWT ----------
# DEV ONLY default. Real secret via env var JWT_SECRET (min 32 chars).
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32chars-min-xyz}
jwt.expiry-ms=${JWT_EXPIRY_MS:86400000}

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.insurance=DEBUG


