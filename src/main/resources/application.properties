
spring.application.name=insurance-quotation-backend
server.port=8080

spring.datasource.url=jdbc:mysql://${DB_HOST:100.99.104.53}:${DB_PORT:3306}/${DB_NAME:iqas}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:iqas_suvetha}
spring.datasource.password=${DB_PASSWORD:}

logging.level.org.springframework.security=DEBUG 
logging.level.root=INFO
logging.level.com.insurance=DEBUG

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32chars-min-xyz}
jwt.expiry-ms=${JWT_EXPIRY_MS:3600000}  

management.endpoints.web.exposure.include=health,info

mailbox.mode=${MAILBOX_MODE:auto}

pricing.daily-rate=100.00
pricing.child-multiplier=0.50
pricing.adult-multiplier=1.00
pricing.senior-multiplier=1.50
pricing.child-max-age=17
pricing.senior-min-age=60
pricing.medical-loading=0.20
pricing.international-surcharge=0.25
pricing.tax-rate=0.00

app.cors-origin=${CORS_ORIGIN:http://localhost:4200}

app.encryption-key=${APP_ENCRYPTION_KEY:replace-this-with-your-own-long-random-text-123456}

app.public-base-url=${PUBLIC_BASE_URL:http://localhost:4200}
app.public-form-url=${PUBLIC_FORM_URL:http://localhost:4200/form}

sms.mode=${SMS_MODE:log}


# # ==========================================
# # QUOTATION RESPONSE REMINDERS
# # ==========================================

quotation.response.scheduler-enabled=true
quotation.response.reminder-after-minutes=5
quotation.response.close-after-reminder-minutes=5
quotation.response.scheduler-delay-ms=1000
# # Enable/disable automatic reminder scheduler
# quotation.response.scheduler-enabled=true

# # Send reminder 3 days after quotation is sent
# quotation.response.reminder-after-days=0

# # Close quotation 2 days after reminder if no response
# quotation.response.close-after-reminder-days=0

# # Check pending quotations every hour
# quotation.response.scheduler-delay-ms=10000



quotation.response.scheduler-enabled=false

# Initial response period: 3 days (example)
quotation.response.reminder-after-days=3

# Additional response period after reminder: 2 days (example)
quotation.response.close-after-reminder-days=2

# Check pending quotations every hour
quotation.response.scheduler-delay-ms=3600000