
spring.application.name=insurance-quotation-backend
server.port=8080

# ---------- Database ----------
# spring.datasource.url=jdbc:mysql://192.168.1.39:3306/iqas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

spring.datasource.url=jdbc:mysql://100.99.104.53:3306/iqas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:iqas_suvetha}
spring.datasource.password=${DB_PASSWORD:}

# ---------- Security Logging ----------
logging.level.org.springframework.security=DEBUG

# ---------- JPA ----------
# Flyway owns schema; Hibernate only validates
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- Flyway ----------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=false

# ---------- JWT ----------
# DEV ONLY default. Use JWT_SECRET in environment.
jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32chars-min-xyz}
jwt.expiry-ms=${JWT_EXPIRY_MS:3600000}

# ---------- Actuator ----------
management.endpoints.web.exposure.include=health,info

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.insurance=DEBUG

# ---------- Mailbox ----------
# demo = simulated email
# gmail = real Gmail read and send
mailbox.mode=${MAILBOX_MODE:auto}

# ---------- Pricing ----------
pricing.daily-rate=100.00
pricing.child-multiplier=0.50
pricing.adult-multiplier=1.00
pricing.senior-multiplier=1.50
pricing.child-max-age=17
pricing.senior-min-age=60
pricing.medical-loading=0.20
pricing.international-surcharge=0.25
pricing.tax-rate=0.00

# ---------- CORS ----------
app.cors-origin=${CORS_ORIGIN:http://localhost:4200}

# ---------- Encryption ----------
# Use your own long random text (32+ characters).
# Do not change the key after encrypting existing data.
app.encryption-key=${APP_ENCRYPTION_KEY:replace-this-with-your-own-long-random-text-123456}

# ---------- Public URLs ----------
app.public-base-url=${PUBLIC_BASE_URL:http://localhost:4200}

# ---------- General Quotation Form URL ----------
# All customer form emails use the same general form.
app.public-form-url=${PUBLIC_FORM_URL:http://localhost:4200/form}

# ---------- SMS ----------
sms.mode=${SMS_MODE:log}
